<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refreshing Lellee</title><style>body{font-family:Arial,sans-serif;background:#f7f1fb;color:#382b57;min-height:100vh;display:grid;place-items:center;margin:0}main{max-width:520px;text-align:center;padding:36px;border-radius:24px;background:#fff;box-shadow:0 18px 60px rgba(61,39,92,.14)}p{line-height:1.5;color:#70657d}</style></head><body><main><h1>Refreshing Lellee…</h1><p>Removing the old old cache and applying the protected landing-logo size lock.</p></main><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const names=await caches.keys();await Promise.all(names.map(n=>caches.delete(n)))}}catch(e){console.warn(e)}location.replace('/landing.html?fresh=20260828-logo-historical-approved-v1')})();</script></body></html>
