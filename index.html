<script id="coach-account-visibility-script">
(function(){
  'use strict';

  const STORAGE_KEY = 'lellee_coach_account_count_visible';
  const WATCH_SELECTOR = [
    '#coachRevenueClients',
    '#coachClientCount',
    '#coachAccountCount',
    '[data-coach-account-count]',
    '[data-coach-client-count]',
    '#page-coach-dashboard',
    '#page-coach-revenue',
    '[data-page="coach-dashboard"]'
  ].join(',');

  function readVisibility(){
    try{return window.sessionStorage?.getItem(STORAGE_KEY)==='true'}catch(_){return false}
  }

  function coachCountNodes(){
    const selectors = [
      '#coachRevenueClients',
      '#coachClientCount',
      '#coachAccountCount',
      '[data-coach-account-count]',
      '[data-coach-client-count]'
    ];
    const set = new Set();
    selectors.forEach(sel => document.querySelectorAll(sel).forEach(el => set.add(el)));

    // Also catch summary cards whose labels clearly identify account/client totals.
    document.querySelectorAll('#page-coach-dashboard article, #page-coach-revenue article, [data-page="coach-dashboard"] article').forEach(card => {
      const label = (card.textContent || '').toLowerCase();
      if (/(active clients|client accounts|accounts|active accounts)/.test(label)) {
        const value = card.querySelector('b, strong, .value, [data-value]');
        if (value) set.add(value);
      }
    });
    return Array.from(set);
  }

  function setVisibility(visible){
    const hidden = !visible;
    const ariaValue = visible ? 'false' : 'true';
    coachCountNodes().forEach(node => {
      if(node.classList.contains('coach-account-count-hidden') !== hidden){
        node.classList.toggle('coach-account-count-hidden', hidden);
      }
      if(node.getAttribute('aria-hidden') !== ariaValue){
        node.setAttribute('aria-hidden', ariaValue);
      }
    });

    const toggle = document.getElementById('coachAccountVisibilityToggle');
    const label = document.getElementById('coachAccountVisibilityLabel');
    if (toggle && toggle.checked !== !!visible) toggle.checked = !!visible;
    const nextLabel = visible ? 'On' : 'Off';
    if (label && label.textContent !== nextLabel) label.textContent = nextLabel;
  }

  let scheduled = false;
  function scheduleVisibility(){
    if(scheduled)return;
    scheduled = true;
    const apply = () => {
      scheduled = false;
      setVisibility(readVisibility());
    };
    if(typeof window.requestAnimationFrame === 'function') window.requestAnimationFrame(apply);
    else window.setTimeout(apply,0);
  }

  function mutationCanAffectCoachCounts(record){
    const target = record.target instanceof Element ? record.target : null;
    // Ignore the label text change made by setVisibility itself.
    if(target?.id === 'coachAccountVisibilityLabel') return false;
    if(target?.closest('#page-coach-dashboard,#page-coach-revenue,[data-page="coach-dashboard"]')) return true;
    return Array.from(record.addedNodes || []).some(node => {
      if(!(node instanceof Element)) return false;
      return node.matches(WATCH_SELECTOR) || !!node.querySelector(WATCH_SELECTOR);
    });
  }

  function init(){
    // Privacy-first: always start hidden in a fresh browser/session.
    setVisibility(readVisibility());

    const toggle = document.getElementById('coachAccountVisibilityToggle');
    if (toggle && !toggle.dataset.bound){
      toggle.dataset.bound = 'true';
      toggle.addEventListener('change', () => {
        const visible = toggle.checked;
        try{window.sessionStorage?.setItem(STORAGE_KEY, visible ? 'true' : 'false')}catch(_){}
        setVisibility(visible);
      });
    }

    // Re-apply only when coach dashboard content is actually inserted.
    // The previous body-wide observer rewrote its own label on every mutation,
    // creating an endless MutationObserver loop that froze the whole page.
    const observer = new MutationObserver(records => {
      if(records.some(mutationCanAffectCoachCounts)) scheduleVisibility();
    });
    observer.observe(document.body, {childList:true, subtree:true});
    window.addEventListener('pagehide', () => observer.disconnect(), {once:true});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, {once:true});
  } else {
    init();
  }
})();
</script>
